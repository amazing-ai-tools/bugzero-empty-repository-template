services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database secret required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, pg_isready -U app -d app]
      interval: 3s
      timeout: 3s
      retries: 40
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data:
    name: bugzero-${SLUG:?app slug required}-postgres
networks:
  database:
    name: bugzero-${SLUG:?app slug required}-database
    internal: true
