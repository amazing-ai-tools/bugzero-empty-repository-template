services:
  api:
    image: ${API_IMAGE:?API image required}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?database URL required}
      BIND_ADDR: 0.0.0.0:8000
      APP_REVISION: ${APP_REVISION:?exact revision required}
      RUST_LOG: info
    networks:
      - default
      - database
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: ${WEB_IMAGE:?frontend image required}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      - api
    ports:
      - 127.0.0.1::8080
    volumes:
      - ${APP_CONFIG_PATH:?runtime config required}:/usr/share/nginx/html/app-config.json:ro
      - ${RELEASE_MANIFEST_PATH:?release manifest required}:/usr/share/nginx/html/qa-release-manifest.json:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SLOT_SUBNET:?reserved slot subnet required}
  database:
    name: bugzero-${SLUG:?app slug required}-database
    external: true
